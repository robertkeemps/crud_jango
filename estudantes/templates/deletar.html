<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>View para Estudantes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="col-sm-6 mx-auto text-center badge-warning p-3" style="border: 1px solid #e0a800; border-radius: 10px;">
        <h1 class="bg-primary text-white p-2" style="border-radius: 6px;">Deseja deletar?</h1>
        <p class="text-dark font-weight-bold mt-3">Você tem certeza que deseja remover este estudante?</p>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger mr-2">Confirmar</button>
            <a href="/" class="btn btn-success">Voltar</a>
        </form>
    </div>
</div>
</body>
</html>
