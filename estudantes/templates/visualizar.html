<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visualizar Estudante</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5 p-4 bg-light" style="border-radius: 10px; max-width: 500px;">
        <h2 class="text-center mb-3">Detalhes do Estudante</h2>
        <div class="text-center mb-3">
            <img src="/midia/{{ estudante.foto }}" class="rounded-circle" width="120" height="120">
        </div>
        <ul class="list-group">
            <li class="list-group-item"><strong>Nome:</strong> {{ estudante.nome }}</li>
            <li class="list-group-item"><strong>E-mail:</strong> {{ estudante.email }}</li>
            <li class="list-group-item"><strong>Telefone:</strong> {{ estudante.numero_celular }}</li>
            <li class="list-group-item"><strong>Nascimento:</strong> {{ estudante.data_de_nascimento }}</li>
        </ul>
        <div class="mt-3">
            <a href="/" class="btn btn-secondary btn-block">Voltar à Listagem</a>
        </div>
    </div>
</body>
</html>
