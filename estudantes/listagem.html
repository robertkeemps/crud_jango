<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Estudantes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5 bg-light" style="border: 1px solid; background-color: #f1f1f1; border-radius: 10px;">
        <h1 class="p-4 text-center">Registros de Estudantes <a href="/adicionar/" class="btn btn-primary">Adicionar Estudante</a></h1>
        <table class="table table-bordered">
            <tr class="bg-info text-white text-center">
                <td>ID</td>
                <td>Nome</td>
                <td>Foto</td>
                <td>Email</td>
                <td>Senha</td>
                <td>Telefone</td>
                <td>Nascimento</td>
                <td>Ações</td>
            </tr>
            {% for reg in registros %}
            <tr class="text-center">
                <td>{{ forloop.counter }}</td>
                <td>{{ reg.nome }}</td>
                <td><img src="/midia/{{ reg.foto }}" class="rounded-circle" height="70px" width="70px"></td>
                <td>{{ reg.email }}</td>
                <td>{{ reg.senha }}</td>
                <td>{{ reg.numero_celular }}</td>
                <td>{{ reg.data_de_nascimento }}</td>
                <td>
                    <a href="/editar/{{ reg.id }}/" class="btn btn-warning">Editar</a>
                    <a href="/deletar/{{ reg.id }}/" class="btn btn-danger">Apagar</a>
                    <a href="/visualizar/{{ reg.id }}/" class="btn btn-primary">Ver</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
