<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar Estudante</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5 p-4 bg-light" style="border-radius: 10px; max-width: 600px;">
        <h2 class="text-center mb-4">Editar Informações do Estudante</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning btn-block">Atualizar</button>
            <a href="/" class="btn btn-secondary btn-block">Cancelar</a>
        </form>
    </div>
</body>
</html>
